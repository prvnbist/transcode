packages:
    - .
allowBuilds:
    # postinstall only prints a funding banner (pulled in by posthog-js)
    core-js: false
    esbuild: true
    lightningcss: true
catalog:
    vite: npm:@voidzero-dev/vite-plus-core@1.6.0
    vite-plus: 1.6.0
overrides:
    vite@*: 'catalog:'
peerDependencyRules:
    allowAny:
        - vite
    allowedVersions:
        vite: '*'
